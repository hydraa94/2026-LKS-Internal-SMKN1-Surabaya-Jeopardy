<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL | Establishing Connection</title>
    <style>
        :root {
            --bg-color: #02040a;
            --card-bg: rgba(13, 17, 23, 0.7);
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --accent-color: #2f81f7;
            --accent-glow: rgba(47, 129, 247, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(13, 17, 23, 0) 0%, rgba(2, 4, 10, 1) 100%),
                linear-gradient(rgba(47, 129, 247, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47, 129, 247, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-primary);
            padding: 16px 32px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            border-radius: 4px;
        }

        .btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
            height: 20px;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="status-text">
                <span class="status-dot"></span>
                Signal Online
            </div>
            <h1>Signal.</h1>
            <p>Something is waiting for you. Establish a connection and see what the system sends back.</p>
            <button id="connectBtn" class="btn">Establish Connection</button>
            <div id="statusMsg" class="message">Transmission complete.</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
